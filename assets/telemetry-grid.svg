<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">Distributed systems telemetry grid</title><desc id="desc">A dark terminal-inspired bento grid showing control plane status, event throughput, reliability, and active work.</desc>
<style>
.bg{fill:#090b10}.card{fill:#0d1117;stroke:#26313d}.label{fill:#7d8b99;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.value{fill:#e6edf3;font:700 25px ui-monospace,SFMono-Regular,Menlo,monospace}.green{fill:#00ff9d}.gold{fill:#f5a623}.line{fill:none;stroke:#00ff9d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 8;animation:flow 7s linear infinite}.blink{animation:blink 1.4s steps(2,start) infinite}@keyframes flow{to{stroke-dashoffset:-140}}@keyframes blink{50%{opacity:0}}
</style>
<rect class="bg" width="1200" height="210" rx="16"/>
<g transform="translate(12 12)"><rect class="card" width="370" height="186" rx="10"/><text class="label" x="20" y="28">CONTROL_PLANE / AGNOS</text><text class="value" x="20" y="67">[ <tspan class="green">LIVE</tspan> ]</text><text class="label" x="20" y="94">WORKFLOW ORCHESTRATION</text><path class="line" d="M20 150 C75 112 120 167 175 132 S275 115 345 146"/><circle class="blink" cx="345" cy="146" r="4" fill="#f5a623"/></g>
<g transform="translate(403 12)"><rect class="card" width="370" height="186" rx="10"/><text class="label" x="20" y="28">EVENT_FABRIC / CLAIMS</text><text class="value" x="20" y="67">7,700+ <tspan class="label">events</tspan></text><text class="label" x="20" y="94">KAFKA → ICEBERG → OBSERVABILITY</text><path class="line" stroke="#f5a623" d="M20 150 L72 128 L124 143 L176 108 L228 126 L280 96 L345 116"/><circle cx="345" cy="116" r="4" fill="#00ff9d"/></g>
<g transform="translate(794 12)"><rect class="card" width="394" height="186" rx="10"/><text class="label" x="20" y="28">RELIABILITY / SLO STATUS</text><text class="value" x="20" y="67"><tspan class="green">99.99%</tspan> <tspan class="label">uptime</tspan></text><text class="label" x="20" y="94">ALERT BUDGET: HEALTHY</text><rect x="20" y="126" width="350" height="8" rx="4" fill="#26313d"/><rect x="20" y="126" width="324" height="8" rx="4" fill="#00ff9d"/><text class="label" x="20" y="164">32 metrics · 22 rules · 0 silent failures</text></g>
</svg>
