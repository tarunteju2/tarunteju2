<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Two engineering planes: autonomous QA and claims data</title>
  <desc id="desc">Architecture map: Agnos routes test intent through Temporal to isolated Playwright workers and auditable evidence; the claims platform streams Kafka events through validation to PostgreSQL and Iceberg, with Prometheus and OpenTelemetry observability.</desc>
  <style>
    .bg{fill:#090b10}.card{fill:#0d1117;stroke:#26313d;stroke-width:1.5}.label{fill:#7d8b99;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.title{fill:#e6edf3;font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace}.node{fill:#101820;stroke:#31404c;stroke-width:1}.nodeText{fill:#dbe4ec;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.green{fill:#00ff9d}.gold{fill:#f5a623}.route{fill:none;stroke:#00ff9d;stroke-width:1.5;stroke-dasharray:5 8;animation:flow 8s linear infinite}.goldRoute{stroke:#f5a623;animation-delay:-4s}.dot{animation:blink 1.8s steps(2,start) infinite}@keyframes flow{to{stroke-dashoffset:-130}}@keyframes blink{50%{opacity:.35}}
  </style>
  <rect class="bg" width="1200" height="250" rx="16"/>
  <g transform="translate(12 12)">
    <rect class="card" width="576" height="226" rx="12"/>
    <text class="label" x="22" y="29">01 / AUTONOMOUS QA</text><text class="title" x="22" y="58">Agnos · control plane</text>
    <path class="route" d="M121 137H465"/><path class="route goldRoute" d="M121 165H465"/>
    <rect class="node" x="22" y="98" width="126" height="52" rx="8"/><text class="nodeText" x="85" y="128" text-anchor="middle">TEST INTENT</text>
    <rect class="node" x="162" y="98" width="126" height="52" rx="8"/><text class="nodeText" x="225" y="128" text-anchor="middle">TEMPORAL</text>
    <rect class="node" x="302" y="98" width="126" height="52" rx="8"/><text class="nodeText" x="365" y="128" text-anchor="middle">PLAYWRIGHT</text>
    <rect class="node" x="442" y="98" width="112" height="52" rx="8"/><text class="nodeText" x="498" y="128" text-anchor="middle">EVIDENCE</text>
    <text class="label" x="22" y="192">LEASED WORKERS · ISOLATED BROWSERS · AUDITABLE RUNS</text>
    <circle class="dot" cx="550" cy="192" r="3" fill="#00ff9d"/>
  </g>
  <g transform="translate(612 12)">
    <rect class="card" width="576" height="226" rx="12"/>
    <text class="label" x="22" y="29">02 / STREAMING DATA</text><text class="title" x="22" y="58">Claims · lineage plane</text>
    <path class="route goldRoute" d="M121 137H465"/><path class="route" d="M121 165H465"/>
    <rect class="node" x="22" y="98" width="126" height="52" rx="8"/><text class="nodeText" x="85" y="128" text-anchor="middle">KAFKA</text>
    <rect class="node" x="162" y="98" width="126" height="52" rx="8"/><text class="nodeText" x="225" y="128" text-anchor="middle">VALIDATE</text>
    <rect class="node" x="302" y="98" width="126" height="52" rx="8"/><text class="nodeText" x="365" y="128" text-anchor="middle">POSTGRES</text>
    <rect class="node" x="442" y="98" width="112" height="52" rx="8"/><text class="nodeText" x="498" y="128" text-anchor="middle">ICEBERG</text>
    <text class="label" x="22" y="192">DLQ · PROMETHEUS · OPENTELEMETRY · JAEGER</text>
    <circle class="dot" cx="550" cy="192" r="3" fill="#f5a623"/>
  </g>
</svg>
