  <text x="58" y="153" class="text small"><tspan class="green">[ OK ]</tspan><tspan> identity: Tarun Tarikere Venkatesha</tspan></text>
  <text x="58" y="181" class="text small"><tspan class="green">[ LIVE ]</tspan><tspan> role: Data Engineer · AI Infrastructure · Distributed Systems</tspan></text>
