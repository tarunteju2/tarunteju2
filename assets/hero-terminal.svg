<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Tarun Tarikere Venkatesha — data systems and AI infrastructure</title>
  <desc id="desc">A terminal-inspired control plane banner with Tarun's identity, engineering focus, and an animated distributed-systems topology.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#18212a" stroke-width="1"/></pattern>
    <radialGradient id="glow"><stop stop-color="#00ff9d" stop-opacity=".14"/><stop offset="1" stop-color="#00ff9d" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .bg{fill:#090b10}.panel{fill:#0d1117;stroke:#26313d;stroke-width:1.5}.grid{opacity:.48}.muted{fill:#7d8b99;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.label{fill:#7d8b99;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px}.name{fill:#e6edf3;font:700 38px ui-monospace,SFMono-Regular,Menlo,monospace}.role{fill:#00ff9d;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}.tagline{fill:#c9d1d9;font:15px ui-monospace,SFMono-Regular,Menlo,monospace}.green{fill:#00ff9d}.gold{fill:#f5a623}.node{fill:#101820;stroke:#31404c;stroke-width:1}.nodetext{fill:#e6edf3;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.route{fill:none;stroke:#00ff9d;stroke-width:1.5;stroke-dasharray:5 8;animation:flow 8s linear infinite}.routegold{stroke:#f5a623;animation-delay:-3s}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:blink 1.1s steps(2,start) infinite}.aurora{fill:url(#glow);animation:drift 8s ease-in-out infinite}.scan{animation:scan 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-130}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes drift{50%{transform:translateX(22px);opacity:.6}}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1250px)}}
  </style>
  <rect class="bg" width="1200" height="390" rx="18"/>
  <rect x="24" y="24" width="1152" height="342" rx="12" fill="url(#grid)"/>
  <rect class="panel" x="24" y="24" width="1152" height="342" rx="12" fill-opacity=".88"/>
  <ellipse class="aurora" cx="926" cy="205" rx="235" ry="190"/>
  <rect class="scan" x="24" y="82" width="150" height="1" fill="#00ff9d" opacity=".45"/>
  <circle cx="54" cy="54" r="5" fill="#ff5f56"/><circle cx="73" cy="54" r="5" fill="#ffbd2e"/><circle cx="92" cy="54" r="5" fill="#27c93f"/>
  <text x="113" y="59" class="muted">tarun@control-plane <tspan class="gold">~</tspan> ./whoami --verbose</text>
  <text x="60" y="111" class="role">DATA ENGINEERING  /  AI INFRASTRUCTURE  /  DISTRIBUTED SYSTEMS</text>
  <text x="60" y="164" class="name">TARUN TARIKERE</text>
  <text x="60" y="207" class="name">VENKATESHA<tspan class="green cursor">_</tspan></text>
  <text x="60" y="252" class="tagline">I build self-healing data pipelines,</text>
  <text x="60" y="277" class="tagline">autonomous AI control planes, and distributed systems</text>
  <text x="60" y="302" class="tagline">that don't page you at <tspan class="gold">3 AM</tspan>.</text>
  <text x="60" y="341" class="muted">JERSEY CITY, NJ  ·  NJIT / MS INFORMATION SYSTEMS — DATA MINING / 3.75 GPA</text>
  <text x="723" y="111" class="label">SYSTEM TOPOLOGY / REFERENCE MODEL</text>
  <path class="route" d="M774 175H1102M774 247H1102M793 175V247M937 175V247M1080 175V247"/>
  <path class="route routegold" d="M774 211H1102"/>
  <rect class="node" x="730" y="148" width="126" height="52" rx="8"/><text class="nodetext" x="793" y="179" text-anchor="middle">INGEST</text>
  <rect class="node" x="875" y="148" width="126" height="52" rx="8"/><text class="nodetext" x="938" y="179" text-anchor="middle">ORCHESTRATE</text>
  <rect class="node" x="1020" y="148" width="126" height="52" rx="8"/><text class="nodetext" x="1083" y="179" text-anchor="middle">EXECUTE</text>
  <rect class="node" x="730" y="220" width="126" height="52" rx="8"/><text class="nodetext" x="793" y="251" text-anchor="middle">VALIDATE</text>
  <rect class="node" x="875" y="220" width="126" height="52" rx="8"/><text class="nodetext" x="938" y="251" text-anchor="middle">PERSIST</text>
  <rect class="node" x="1020" y="220" width="126" height="52" rx="8"/><text class="nodetext" x="1083" y="251" text-anchor="middle">OBSERVE</text>
  <circle class="pulse" cx="1146" cy="302" r="4" fill="#00ff9d"/><text x="1133" y="307" text-anchor="end" class="label">DESIGN FOR RECOVERY</text>
</svg>
