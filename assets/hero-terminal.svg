  <rect class="panel" x="24" y="24" width="1152" height="282" rx="12"/>
  <circle cx="54" cy="54" r="6" fill="#ff5f56"/><circle cx="76" cy="54" r="6" fill="#ffbd2e"/><circle cx="98" cy="54" r="6" fill="#27c93f"/>
